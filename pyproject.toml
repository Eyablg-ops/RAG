[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eyaaa.blg", email = "eyablg@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9.1",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
